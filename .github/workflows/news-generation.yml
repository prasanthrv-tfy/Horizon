name: News-Generation-Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours'
        default: '6'
      profile:
        description: 'Blog profile (engineer / news / all)'
        default: 'engineer'
      max_posts:
        description: 'Maximum number of blog posts to generate'
        default: '1'
      publish_mode:
        description: 'Webflow publish mode (draft / live)'
        default: 'live'
      max_publish:
        description: 'Maximum number of posts to push to Webflow'
        default: ''
      dry_run:
        description: 'Skip Webflow publish step'
        type: boolean
        default: false

jobs:
  pipeline:
    uses: prasanthrv-tfy/Horizon/.github/workflows/pipeline.yml@blog
    with:
      hours:        ${{ inputs.hours        || '6' }}
      profile:      ${{ inputs.profile      || 'engineer' }}
      max_posts:    ${{ inputs.max_posts    || '1' }}
      publish_mode: ${{ inputs.publish_mode || 'live' }}
      max_publish:  ${{ inputs.max_publish  || '' }}
      dry_run:      ${{ inputs.dry_run      == true }}
    secrets: inherit