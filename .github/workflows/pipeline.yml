name: News-Generation-Pipeline

on:
  workflow_call:
    inputs:
      hours:
        type: string
        default: '24'
      profile:
        type: string
        default: 'engineer'
      max_posts:
        type: string
        default: '1'
      publish_mode:
        type: string
        default: 'draft'
      max_publish:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:    { required: false }
      ANTHROPIC_API_KEY: { required: false }
      GOOGLE_API_KEY:    { required: false }
      LWN_KEY:           { required: false }
      TFY_BASE_URL:      { required: true }
      TFY_API_KEY:       { required: true }
      TFY_HOST:          { required: true }
      WEBFLOW_TOKEN:     { required: true }
      ARTIFACTS_ML_REPO: { required: true }

  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours'
        default: '24'
      profile:
        description: 'Blog profile (engineer / news / all)'
        default: 'engineer'
      max_posts:
        description: 'Maximum number of blog posts to generate'
        default: '1'
      publish_mode:
        description: 'Webflow publish mode (draft / live)'
        default: 'draft'
      max_publish:
        description: 'Maximum number of posts to push to Webflow'
        default: ''
      dry_run:
        description: 'Skip Webflow publish step'
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: blog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra upload

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          TFY_BASE_URL: ${{ secrets.TFY_BASE_URL }}
          TFY_API_KEY: ${{ secrets.TFY_API_KEY }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          ARTIFACTS_ML_REPO: ${{ secrets.ARTIFACTS_ML_REPO }}
          TFY_HOST: ${{ secrets.TFY_HOST }}
        run: |
          bash scripts/run-pipeline.sh \
            --hours "${{ inputs.hours || '24' }}" \
            --profile "${{ inputs.profile || 'engineer' }}" \
            ${{ inputs.max_posts != '' && format('--max-posts {0}', inputs.max_posts) || '' }} \
            --publish "${{ inputs.publish_mode || 'draft' }}" \
            ${{ inputs.max_publish != '' && format('--max-publish {0}', inputs.max_publish) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}